name: ANIX PRO Unit and Widget Tests
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Run core, feature, and non-game widget tests
        run: |
          set -o pipefail
          flutter test test/core --reporter expanded 2>&1 | tee unit-widget-tests.txt
          flutter test test/features --reporter expanded 2>&1 | tee -a unit-widget-tests.txt
          flutter test test/worlds --reporter expanded 2>&1 | tee -a unit-widget-tests.txt
          flutter test test/app/auth_gate_test.dart --reporter expanded 2>&1 | tee -a unit-widget-tests.txt
          flutter test test/widget_test.dart --reporter expanded 2>&1 | tee -a unit-widget-tests.txt
        shell: bash
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anix-pro-unit-widget-${{ github.sha }}
          path: unit-widget-tests.txt
          if-no-files-found: warn
          retention-days: 14
