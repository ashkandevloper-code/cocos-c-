name: ANIX PRO Quick Check

on:
  pull_request:
  push:
    branches: ['work/**']

permissions:
  contents: read

concurrency:
  group: anix-pro-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt
        shell: bash
      - name: Run Flutter tests
        run: flutter test --reporter expanded 2>&1 | tee tests.txt
        shell: bash
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anix-pro-check-${{ github.sha }}
          path: |
            analyze.txt
            tests.txt
          if-no-files-found: warn
          retention-days: 14
