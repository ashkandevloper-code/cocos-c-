name: ANIX PRO Android Release Build
on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag passed after full validation succeeds.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  android-release:
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
