name: ANIX PRO Debug APK Build

on:
  push:
    branches: ['work/anix-visual-upgrade']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      GAMES_SUPABASE_URL: ${{ secrets.GAMES_SUPABASE_URL }}
      GAMES_SUPABASE_ANON_KEY: ${{ secrets.GAMES_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nexora --project-name nexora .
          fi
          python3 - <<'PY'
          import glob
          for path in glob.glob('android/app/build.gradle*'):
              text = open(path, encoding='utf-8').read()
              if 'coreLibraryDesugaring' in text:
                  continue
              if path.endswith('.kts'):
                  text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  text += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              else:
                  text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  text += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n"
              open(path, 'w', encoding='utf-8').write(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=LIVEKIT_URL="$LIVEKIT_URL" \
            --dart-define=GAMES_SUPABASE_URL="$GAMES_SUPABASE_URL" \
            --dart-define=GAMES_SUPABASE_ANON_KEY="$GAMES_SUPABASE_ANON_KEY" 2>&1 | tee debug-apk.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anix-pro-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anix-pro-debug-apk-log-${{ github.sha }}
          path: debug-apk.txt
          if-no-files-found: warn
          retention-days: 14
