name: Set up ANIX PRO Flutter
description: Install the repository's Flutter SDK and locked Dart packages.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: '3.50.0'
        channel: stable
        cache: true
        cache-key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
    - name: Install locked dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
