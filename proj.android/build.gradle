// NEXORA cocos2d-x 4.0 Android project.
// Pinned toolchain (see .github/workflows/android.yml): AGP 4.1.3, Gradle 6.7.1, JDK 11, NDK r21e, CMake 3.10.2.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Pin the NDK for every module (incl. :libcocos2dx), otherwise AGP 4.1 silently downloads its default r21b.
subprojects {
    plugins.withId('com.android.library') { android { ndkVersion PROP_NDK_VERSION } }
    plugins.withId('com.android.application') { android { ndkVersion PROP_NDK_VERSION } }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
